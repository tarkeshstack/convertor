name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordly-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Wordly debug APK (build ${{ github.run_number }})
          body: |
            Automatically built debug APK for commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            This is a debug build (unsigned for release, self-signed with the default debug key) intended for installing directly on a device for testing. Enable "Install from unknown sources" for your file manager/browser to sideload it.
          files: ${{ steps.apk.outputs.path }}
