name: Build APK

on:
  push:
    branches:
      - '**'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: apk
        run: |
          apk_path=$(find android/app/build/outputs/apk/debug -name '*.apk' | head -n1)
          echo "path=$apk_path" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordly-debug-apk
          path: ${{ steps.apk.outputs.path }}

      - name: Decode release keystore
        working-directory: android/app
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.keystore
          fi

      - name: Build release AAB
        id: bundle
        working-directory: android
        env:
          RELEASE_KEYSTORE_PATH: release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew bundleRelease --no-daemon
          if [ -f app/release.keystore ]; then
            echo "aab_note=Signed with the configured release keystore -- ready to upload to Play Console as-is." >> "$GITHUB_OUTPUT"
          else
            echo "aab_note=Unsigned -- the RELEASE_KEYSTORE_* secrets are not configured on this repo, so it needs to be signed with a release keystore before uploading to Play Console." >> "$GITHUB_OUTPUT"
          fi

      - name: Locate AAB
        id: aab
        run: |
          aab_path=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -n1)
          echo "path=$aab_path" >> "$GITHUB_OUTPUT"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wordly-release-aab
          path: ${{ steps.aab.outputs.path }}

      - name: Publish APK/AAB as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_id }}
          name: Wordly debug APK (build ${{ github.run_number }})
          body: |
            Automatically built for commit ${{ github.sha }} on branch `${{ github.ref_name }}`.

            - `app-debug.apk` — debug build (unsigned for release, self-signed with the default debug key), for installing directly on a device to test.
            - `app-release.aab` — release Android App Bundle for Play Store submission. ${{ steps.bundle.outputs.aab_note }}
          files: |
            ${{ steps.apk.outputs.path }}
            ${{ steps.aab.outputs.path }}
