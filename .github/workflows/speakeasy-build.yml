name: SpeakEasy - Build debug APK

on:
  push:
    branches:
      - main
      - "claude/**"
    paths:
      - "speakeasy/**"
      - ".github/workflows/speakeasy-build.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    defaults:
      run:
        working-directory: speakeasy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: speakeasy-debug-apk
          path: speakeasy/app/build/outputs/apk/debug/*.apk

  # Compiling is not the same as running: this boots a real emulator, installs the
  # freshly built debug APK, launches MainActivity, and fails the job (with the
  # logcat crash trace printed) if the app crashes instead of staying up.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: speakeasy-debug-apk
          path: apk

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, and check for a crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          script: |
            APK=$(find apk -name "*.apk" | head -n1)
            echo "Installing $APK"
            adb install -r "$APK"
            adb logcat -c
            adb shell am start -n com.tarkeshstack.speakeasy/.MainActivity -W
            sleep 10
            adb logcat -d > logcat.txt
            echo "----- last 400 lines of logcat -----"
            tail -n 400 logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then
              echo "::error::App crashed on launch"
              grep -A 60 "FATAL EXCEPTION" logcat.txt
              exit 1
            fi
            if ! adb shell pidof com.tarkeshstack.speakeasy; then
              echo "::error::App process is not running after launch (no FATAL EXCEPTION found, but it exited)"
              exit 1
            fi
            echo "App launched and stayed running — smoke test passed"

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speakeasy-smoke-test-logcat
          path: logcat.txt

  commit-apk:
    needs: [build, smoke-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: speakeasy-debug-apk
          path: apk

      # Workflow-run artifacts only download via a signed Azure blob URL that some
      # sandboxes/CI viewers can't reach, so also commit the built APK straight into
      # the repo (outside speakeasy/ so this commit doesn't retrigger the build).
      - name: Commit built APK to repo
        run: |
          mkdir -p speakeasy-dist
          cp apk/*.apk speakeasy-dist/speakeasy-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f speakeasy-dist/speakeasy-debug.apk
          git diff --cached --quiet && echo "APK unchanged, nothing to commit" && exit 0
          git commit -m "Add built SpeakEasy debug APK [skip ci]"
          git push
